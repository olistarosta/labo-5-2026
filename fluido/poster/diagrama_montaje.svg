<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 122 96" width="1220" height="960" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="agua" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3473b0"/>
      <stop offset="1" stop-color="#16385c"/>
    </linearGradient>
  </defs>
  <rect width="122" height="96" fill="#161a20"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- soporte: base sobre la mesa, columna y brazo -->
    <path d="M6 79 V9 H32" stroke="#7d7d7d" stroke-width="1.6"/>
    <!-- campo de visión -->
    <path d="M38.5 17 L16 49 M45.5 17 L68 49" stroke="#a79fdc" stroke-width="0.8" stroke-dasharray="2.2 1.8"/>
    <!-- agua con la superficie hundida por el vórtice -->
    <path d="M16.6 53 C27 53 33.5 54 37.5 59.5 C39.8 63 41 67.5 42 69 C43 67.5 44.2 63 46.5 59.5 C50.5 54 57 53 67.4 53
             L64.2 75 H19.8 Z" fill="url(#agua)" stroke="none"/>
    <path d="M16.6 53 C27 53 33.5 54 37.5 59.5 C39.8 63 41 67.5 42 69 C43 67.5 44.2 63 46.5 59.5 C50.5 54 57 53 67.4 53"
          stroke="#8cc4ff" stroke-width="1"/>
    <!-- palangana -->
    <path d="M12 49 H16 L20 75.5 H64 L68 49 H72" stroke="#e8e8e8" stroke-width="1.7"/>
    <!-- sentido de giro -->
    <path d="M29 58.5 C34 61.6 50 61.6 55 58.5" stroke="#f0a050" stroke-width="1.3"/>
    <path d="M52.1 57.4 L55.2 58.4 L53.3 61" stroke="#f0a050" stroke-width="1.3"/>
    <!-- agitador -->
    <rect x="10" y="79" width="64" height="12" rx="2.2" fill="#262a31" stroke="#e8e8e8" stroke-width="1.4"/>
    <circle cx="19" cy="85" r="2.9" stroke="#e8e8e8" stroke-width="1.1"/>
    <path d="M19 85 L20.9 83" stroke="#e8e8e8" stroke-width="1.1"/>
    <path d="M27 85 H42" stroke="#5a5e66" stroke-width="1.1"/>
  </g>
  <!-- imán -->
  <rect x="35.5" y="72" width="13" height="2.8" rx="1.4" fill="#f0a050"/>
  <!-- cámara -->
  <rect x="32" y="4" width="20" height="10" rx="2" fill="#262a31" stroke="#e8e8e8" stroke-width="1.3"/>
  <rect x="38" y="14" width="8" height="3.6" rx="0.9" fill="#262a31" stroke="#e8e8e8" stroke-width="1.3"/>
  <circle cx="48.3" cy="9" r="1.2" fill="#35d435"/>
  <!-- polvo trazador -->
  <g fill="#f3ead2">
    <circle cx="19.5" cy="52.7" r="0.55"/><circle cx="23" cy="53.1" r="0.45"/><circle cx="26.5" cy="52.8" r="0.6"/>
    <circle cx="30" cy="53.4" r="0.45"/><circle cx="33.3" cy="54.6" r="0.55"/><circle cx="36" cy="57.2" r="0.45"/>
    <circle cx="38.3" cy="60.6" r="0.55"/><circle cx="40" cy="64.5" r="0.45"/>
    <circle cx="44" cy="64.5" r="0.45"/><circle cx="45.7" cy="60.6" r="0.55"/><circle cx="48" cy="57.2" r="0.45"/>
    <circle cx="50.7" cy="54.6" r="0.55"/><circle cx="54" cy="53.4" r="0.45"/><circle cx="57.5" cy="52.8" r="0.6"/>
    <circle cx="61" cy="53.1" r="0.45"/><circle cx="64.5" cy="52.7" r="0.55"/>
  </g>

  <!-- partícula en el centro del vórtice -->
  <circle cx="42" cy="66.3" r="1.5" fill="#ffce46" stroke="#161a20" stroke-width="0.4"/>

  <!-- líneas guía: todas horizontales, terminan en un punto sobre el objeto -->
  <g stroke="#9a9a9a" stroke-width="0.5">
    <path d="M52.5 9 H85"/>
    <path d="M64.5 52.7 H85"/>
    <path d="M43.6 66.3 H85"/>
    <path d="M48.5 73.4 H85"/>
    <path d="M74 85 H85"/>
  </g>
  <g fill="#9a9a9a">
    <circle cx="64.5" cy="52.7" r="0.9"/>
        <circle cx="48.5" cy="73.4" r="0.9"/>
  </g>
  <g font-family="Inter, sans-serif" font-size="6.4" fill="#f0f0f0" dominant-baseline="central">
    <text x="87" y="9">cámara</text>
    <text x="87" y="52.7">trazador</text>
    <text x="87" y="66.1">partícula</text>
    <text x="87" y="73.6">imán</text>
    <text x="87" y="85">agitador</text>
  </g>
</svg>
